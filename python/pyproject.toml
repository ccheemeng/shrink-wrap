[project]
name = "shrink-wrap"
version = "2.0.0-alpha.0"
requires-python = ">=3.5,<=3.15"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/shrink_wrap/bin/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
